<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Explorer</title>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="top">
  <h1>Chart explorer <span class="muted">v2</span></h1>
  <a class="toplink" href="./">← Strategy Lab</a>
</header>
<main>
  <div class="card">
    <p class="muted small" style="margin-top:0">Any session, any instrument: the chosen strategy's rules applied to that instrument's own candles,
      priced with its position rules. A visualization, not a backtest — nothing is stored.</p>
    <div class="rp-row fld">
      <label>Date <input type="date" id="x-date"></label>
      <label>Strategy <select id="x-code"></select></label>
      <label>Candles <select id="x-tf"></select></label>
      <label>Holding <select id="x-hold"><option value="own">strategy's</option><option value="15:25">intraday 15:25</option><option value="none">positional</option></select></label>
      <label>Sessions before <select id="x-before"><option>0</option><option selected>1</option><option>2</option><option>3</option></select></label>
    </div>
    <div class="rp-row fld" style="margin-top:10px">
      <span class="seg" id="x-inst"><button data-i="FUT" class="on">Near-month futures</button><button data-i="INDEX">NIFTY index</button><button data-i="OPT">Option</button></span>
      <span id="x-opt" class="rp-row fld" hidden>
        <label>Expiry <select id="x-exp"></select></label>
        <span class="seg" id="x-right"><button data-r="CE" class="on">CE</button><button data-r="PE">PE</button></span>
        <label>Strike <select id="x-strike"></select></label>
        <label>Show from <select id="x-start">
          <option value="days">sessions before the date</option>
          <option value="listing">its first candle (listing)</option>
          <option value="prev_expiry">the previous expiry</option>
          <option value="atm">when it first became ATM</option>
          <option value="itm">when it first became ITM</option>
          <option value="liquid">its first liquid session</option>
        </select></label>
        <label id="x-liq-l" hidden>Liquid at % of peak volume <input id="x-liq" type="number" min="1" max="100" value="10" style="width:5em"></label>
        <label>Show to <select id="x-end"><option value="date">the date</option><option value="expiry">expiry (last candle)</option></select></label>
      </span>
      <button id="x-go" class="primary">Show</button>
    </div>
    <div id="x-msg" class="msg muted"></div>
    <div id="x-miles" class="chips" style="margin-top:6px"></div>
  </div>
  <div class="card"><div id="x-chart"></div></div>
  <div class="card">
    <h3>Trades on this instrument <span id="x-sum" class="muted"></span></h3>
    <div class="tablewrap tall"><table class="tbl" id="x-trades"></table></div>
    <details class="skipped"><summary id="x-sk-sum">Not taken</summary><div id="x-sk"></div></details>
  </div>
</main>
<script type="module" src="js/explorer.js"></script>
</body>
</html>

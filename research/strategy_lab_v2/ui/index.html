<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Lab v2</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/tabs.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="top">
  <h1>Strategy Lab <span class="muted">v2</span></h1>
  <a class="toplink" href="explorer.html">Chart explorer</a>
  <div id="jobs" class="jobs"></div>
</header>

<main>
  <section class="cardsec">
    <div class="row between wrap gap">
      <div id="fam" class="chips"></div>
      <div class="row gap">
        <button id="cards-toggle" hidden>Show all as cards</button>
        <input id="search" type="search" placeholder="search strategies" aria-label="Search strategies">
        <select id="sort" aria-label="Sort cards">
          <option value="code">by code</option><option value="net">by net</option><option value="pf">by profit factor</option><option value="recent">recently run</option>
        </select>
      </div>
    </div>
    <div id="cards" class="cards"></div>
  </section>

  <section id="detail" hidden>
    <div class="card">
      <h2 id="d-title"></h2>
      <p id="d-desc" class="desc"></p>
      <p id="d-rules" class="rules"></p>
    </div>

    <div class="card">
      <div class="row between wrap gap">
        <h3>Backtests</h3>
        <span id="run-meta" class="muted small"></span>
      </div>
      <div id="bt-tabs" class="tabs"></div>
      <div id="bt-vars" class="segs"></div>
      <details class="runpanel" open>
        <summary>Run <span class="muted">— this strategy only</span></summary>
        <div class="rp">
          <div class="rp-row"><button id="rp-this" class="primary">Run this backtest</button>
            <span class="muted small">or a new period:</span><span id="rp-presets" class="chips"></span></div>
          <div class="rp-row">
            <label>From <input type="date" id="rp-from"></label><label>To <input type="date" id="rp-to"></label>
            <label>Label <input id="rp-label" placeholder="optional" maxlength="40"></label>
            <button id="rp-custom">Run dates</button>
          </div>
          <div class="rp-row">
            <label>Candles <select id="rp-tf"><option value="">strategy's</option><option value="minute">1m</option><option value="3minute">3m</option>
              <option value="5minute">5m</option><option value="15minute">15m</option><option value="30minute">30m</option></select></label>
            <label>Signals on <select id="rp-und"><option value="">strategy's</option><option value="FUT">futures</option><option value="INDEX">index</option></select></label>
            <label>Holding <select id="rp-sq"><option value="keep">strategy's</option><option value="none">positional</option><option value="15:25">intraday 15:25</option></select></label>
            <span id="rp-types" class="chips">
              <label class="ck"><input type="checkbox" value="FUT" checked> Futures</label>
              <label class="ck"><input type="checkbox" value="OPT_FUT_SIGNAL" checked> Options (via futures)</label>
              <label class="ck"><input type="checkbox" value="OPT_NATIVE" checked> Options (standalone)</label>
            </span>
          </div>
          <div id="rp-msg" class="msg"></div>
        </div>
      </details>
    </div>

    <div id="run-none" class="card muted" hidden></div>
    <div id="run-body">
      <div class="card">
        <div id="types" class="types"></div>
        <div id="optbar" class="optbar" hidden></div>
      </div>
      <div id="res">
        <div class="card">
          <div id="crumb" class="crumb"></div>
          <div id="kpis" class="kpis"></div>
          <div id="kpi-note" class="muted small"></div>
        </div>
        <div class="card" id="chart-card">
          <h3>Chart</h3>
          <div id="chart-view"></div>
        </div>
        <div class="card">
          <div id="tabs" class="tabs sticky"></div>
          <div id="tab-body"></div>
        </div>
      </div>
    </div>
  </section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>

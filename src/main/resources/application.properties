spring.application.name=money-maker
server.port=8080
server.shutdown=graceful

# ---------- Run mode ----------
# live     -> LoginScheduler is active (08:00 cron + 1-min heartbeat).
#             Backtest controller is NOT registered (POST /api/backtest/* returns 404).
# backtest -> Scheduler is disabled. Backtest controller is registered and
#             POST /api/backtest/login can drive LoginOrchestrator manually.
app.mode=live

# ---------- Backtest ----------
# When true, POST /api/backtest/analysis purges trade_order + alert_state
# rows + in-memory caches for the requested date range BEFORE running.
# Default false in production so an operator inspecting prior output
# doesn't lose it; test profile (application-test.properties) overrides
# to true so every BacktestParityTest starts from a clean slate.
backtest.auto-reset=false

# ---------- Market hours (NSE / NFO default) ----------
# Live-mode pipeline schedulers (AnalysisScheduler, OrderScheduler,
# PositionScheduler) early-exit when the wall clock is outside this window.
# DaySummaryScheduler fires at app.market.summary-cron (default 15:31 IST),
# force-closes any leftover OPEN trades at app.market.close, and sends one
# Telegram per trading day.
app.market.open=09:15
app.market.close=15:30
app.market.timezone=Asia/Kolkata
app.market.summary-cron=0 31 15 * * MON-FRI

# ---------- Database (MySQL, mirrors ui-java tradedb) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/moneymath?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Liquibase ----------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ---------- Thymeleaf ----------
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.web.resources.static-locations=classpath:/static/


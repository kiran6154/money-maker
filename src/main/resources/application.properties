spring.application.name=money-maker
server.port=8080
server.shutdown=graceful

# ---------- Run mode ----------
# live     -> LoginScheduler is active (08:00 cron + 1-min heartbeat).
#             Backtest controller is NOT registered (POST /api/backtest/* returns 404).
# backtest -> Scheduler is disabled. Backtest controller is registered and
#             POST /api/backtest/login can drive LoginOrchestrator manually.
app.mode=backtest

# ---------- Backtest data source ----------
# BROKER           -> candles come from the active broker (default; unchanged behaviour).
# HISTORICAL_ICICI -> candles come from historical_spot_candles /
#                     historical_option_candles, i.e. the ICICI CSVs imported via
#                     POST /api/charts/historical/import/{spot,options}. Lets a
#                     backtest replay offline and deterministically with no broker
#                     session and no rate limit.
#
# Only meaningful with app.mode=backtest — setting HISTORICAL_ICICI while
# app.mode=live fails startup, since live must never trade off replay data.
#
# Notes when HISTORICAL_ICICI is active:
#   - expiry is resolved from the imported data (nearest expiry_date >= trading
#     date), not from expiry_dates, so historical expiry conventions such as the
#     2024 Thursday weeklies work without a weekday rule;
#   - the tables store 5-minute candles; 10minute/15minute and "day" are all
#     aggregated from them ("day" = one bar per trading date, so EOD downtrend
#     detection runs here too, bounded by how many days have been imported);
#   - a completely missing series aborts the run rather than trading around it.
backtest.data-source=HISTORICAL_ICICI

# Which MarketDataProvider every candle fetch goes through. Read by
# MarketDataProviderFactory (GAPS #20). Left BLANK on purpose: with nothing set,
# the factory uses the only registered provider, or -- when both are registered,
# which is the case today -- its default precedence, which puts HISTORICAL_ICICI
# ahead of ZERODHA so an active replay can never fall through to a live broker
# API. Set it to a provider name (ZERODHA / HISTORICAL_ICICI) to override; a name
# that matches no registered provider fails startup rather than falling back.
market.data.provider=

# ---------- Market hours (NSE / NFO default) ----------
# Live-mode pipeline schedulers (AnalysisScheduler, OrderScheduler,
# PositionScheduler) early-exit when the wall clock is outside this window.
# DaySummaryScheduler fires at app.market.summary-cron (default 15:31 IST),
# force-closes any leftover OPEN trades at app.market.close, and sends one
# Telegram per trading day.
app.market.open=09:15
app.market.close=15:30
app.market.timezone=Asia/Kolkata
# Derived session times (S5): all three default to the constants they replaced,
# so the effective times stay 15:15 / 09:20 / 15:20 unless changed here.
# close-signal: when CommonRules.isMarketCloseTime fires (close - offset).
# replay-first/last-tick: a backtest day's loop bounds (open + / close - offset).
app.market.close-signal-offset-minutes=15
app.market.replay-first-tick-offset-minutes=5
app.market.replay-last-tick-offset-minutes=10
app.market.summary-cron=0 31 15 * * MON-FRI
# Heartbeat window (GAPS #3). LoginScheduler.heartbeat probes only on weekdays
# between these two times; outside it a valid broker session is moot until the
# next 08:00 login. Absolute times, not offsets from open/close, because the
# lower bound's job is to clear the 08:00 login cron: alerts fire on
# transitions, so a dead token must be probed before login runs for the alert
# to be worth anything. Startup refuses a window narrower than open..close.
app.market.heartbeat-start=07:50
app.market.heartbeat-end=15:40

# ---------- Database (MySQL, mirrors ui-java tradedb) ----------
# rewriteBatchedStatements=true is load-bearing for the historical CSV import:
# without it Connector/J still round-trips once per row inside a batch, and the
# ~3.8M-row ICICI data set takes hours instead of minutes. See
# HistoricalChartCsvImportService. It also means MySQL reports
# Statement.SUCCESS_NO_INFO for rewritten batches, which is why that endpoint
# reports rows processed rather than an inserted/updated split.
spring.datasource.url=jdbc:mysql://localhost:3306/moneymath?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true&rewriteBatchedStatements=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Batches Hibernate's own saveAll paths. Does nothing for the two historical
# candle entities — GenerationType.IDENTITY disables insert batching outright,
# which is exactly why their importer uses plain JDBC — but helps everywhere else.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------- Liquibase ----------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ---------- Thymeleaf ----------
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.web.resources.static-locations=classpath:/static/

# ---------- Historical chart CSV imports ----------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


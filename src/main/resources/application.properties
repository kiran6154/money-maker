spring.application.name=money-maker
server.port=8080
server.shutdown=graceful

# ---------- Database (MySQL, mirrors ui-java tradedb) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/moneymath?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Liquibase ----------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ---------- Thymeleaf ----------
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.web.resources.static-locations=classpath:/static/

# ---------- Broker login ----------
# Active broker: zerodha | groww
broker.active=zerodha

# Zerodha (Kite Connect) ? credentials shared with ui-java
broker.zerodha.enabled=true
broker.zerodha.api-key=${KITE_API_KEY:t8q43ogv9yatd565}
broker.zerodha.api-secret=${KITE_API_SECRET:ezyavcjri9rruaghb4wyyrltw3kl9gl2}
broker.zerodha.user-id=
broker.zerodha.redirect-url=http://localhost:8080/login/callback

# Groww (TOTP-based access token)
broker.groww.enabled=false
broker.groww.api-key=
broker.groww.api-secret=
broker.groww.totp-secret=

# Angel One (SmartAPI ? TOTP-based daily login)
broker.angel-one.enabled=false
broker.angel-one.api-key=
broker.angel-one.client-code=
broker.angel-one.password=
broker.angel-one.totp-secret=


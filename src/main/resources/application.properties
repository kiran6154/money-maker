# ---------- Options bulk-download ----------
# How many strike-points to extend beyond the min/max in instruments.csv when
# bulk-downloading weekly options. Example: CSV range 22000-22700 with
# extension=200 yields a fetch window of 21800-22900 (CE + PE).
options.download.range-extension=200

# ---------- Docs viewer (/docs) ----------
# Root directory scanned for *.md files. Defaults to the working dir, which is
# the project root when running via `mvn spring-boot:run`. Adjust if you start
# the jar from a different CWD.
docs.root=.
docs.max-depth=4

# ---------- Resilience4j: Kite historical-data rate limit + retry ----------
# Throttle: Zerodha allows ~3 historical req/sec. We sit at the documented limit;
# tighten if you see 429s through the limiter. timeout-duration = how long a
# caller will block waiting for a permit before failing fast.
resilience4j.ratelimiter.instances.kiteHistorical.limit-for-period=15
resilience4j.ratelimiter.instances.kiteHistorical.limit-refresh-period=1s
resilience4j.ratelimiter.instances.kiteHistorical.timeout-duration=60s
resilience4j.ratelimiter.instances.kiteHistorical.register-health-indicator=false

# Retry: only KiteRateLimitException triggers backoff. 4 attempts total
# (1 initial + 3 retries) with exponential backoff: 200ms, 400ms, 800ms (cap 5s).
resilience4j.retry.instances.kiteHistorical.max-attempts=4
resilience4j.retry.instances.kiteHistorical.wait-duration=200ms
resilience4j.retry.instances.kiteHistorical.enable-exponential-backoff=true
resilience4j.retry.instances.kiteHistorical.exponential-backoff-multiplier=2
resilience4j.retry.instances.kiteHistorical.exponential-max-wait-duration=5s
resilience4j.retry.instances.kiteHistorical.retry-exceptions=com.moneymaker.market.exception.KiteRateLimitException

# ---------- Logging ----------
# Spring Boot log levels (least → most verbose):
#   OFF < ERROR < WARN < INFO < DEBUG < TRACE
# Child packages inherit the parent's level unless they have their own override.
#
# Recommended:
#   - PRODUCTION    : INFO  on com.moneymaker, OFF on third-party.
#   - DEV / LOCAL   : INFO  on com.moneymaker, DEBUG on the one or two packages
#                     you're investigating (uncomment a line below).
#   - DEEP DEBUG    : TRACE on the single package you're tracing (very noisy).
#
# What lives at each level today:
#   INFO  — start/end of a backtest day, signals emitted, orders opened/closed,
#           force-close summaries, trade-config-for-the-day report, errors.
#   DEBUG — per-tick context: SMA values on each candle, RuleEngine gate
#           decisions, skip-reason for OrderService, scheduler ticks,
#           per-strike candle counts after SMA compute.
#   TRACE — per-rule pass/fail inside RuleEngine.evaluate.

# root=WARN keeps the firehose quiet but guarantees ERROR/WARN from ANY package
# (Spring, Hibernate, Tomcat, JPA, etc.) surfaces in the log. With root=OFF those
# errors get swallowed and a silent crash looks identical to a normal quiet run.
logging.level.root=WARN
logging.level.com.moneymaker=INFO

# ----- Per-package overrides — uncomment what you need -----
# Strategy + rule-engine internals (signal eval, gate, rule pass/fail).
#logging.level.com.moneymaker.strategy=DEBUG
#logging.level.com.moneymaker.strategy.rules=DEBUG
# TRACE here logs every individual required / anyOf rule check — very noisy.
#logging.level.com.moneymaker.strategy.rules=TRACE

# Schedulers (data fetch lookback, per-strike SMA snapshot, ticks).
#logging.level.com.moneymaker.scheduler=DEBUG

# Order lifecycle + skip reasons (dedupe, parallel cap, transactionType guard).
#logging.level.com.moneymaker.order=DEBUG

# Position monitor (peak tracking, threshold breach, force-close).
#logging.level.com.moneymaker.position=DEBUG

# Indicator compute (SMA period unavailable, etc).
#logging.level.com.moneymaker.indicator=DEBUG

# Bulk option download, instruments parsing, broker quotes.
logging.level.com.moneymaker.data.download=DEBUG
#logging.level.com.moneymaker.market=DEBUG

# Backtest run wiring (per-day delta, force-close summary).
#logging.level.com.moneymaker.backtesting=DEBUG

# Telegram notifier internals (skip reasons, dedupe state).
#logging.level.com.moneymaker.telegram=DEBUG

# ----- Quick-start preset for the per-tick narrative log -----
# When all five are on, every backtest tick prints:
#   === Analysis YYYY-MM-DDTHH:MM START ===
#   [index]    NIFTY spot=... ATM=... ITM=[...] OTM=[...]
#   [tick]     tf=5min 23700 CE open=.. close=.. sma20=.. sellGate=.. → NONE/SELL/BUY (reason)
#   [position] orderId=N entry=.. cur=.. pl=.. maxPL=.. → hold/TARGET/STOP_LOSS
#   [order] OPEN/CLOSE/skip ...
#   === Analysis ... END (signals=N, opened=N, closed=N, dur=Xms) ===
#
# OFF by default (2026-08-31): with all six at DEBUG a year-long replay prints
# millions of lines, and console rendering dominated the run time (~12 min for
# a year, most of it logging). Re-enable per package only while debugging a
# specific day, never for a sweep.
#logging.level.com.moneymaker.scheduler=DEBUG
#logging.level.com.moneymaker.strategy=DEBUG
#logging.level.com.moneymaker.strategy.rules=DEBUG
#logging.level.com.moneymaker.backtesting=DEBUG
#logging.level.com.moneymaker.position=DEBUG
#logging.level.com.moneymaker.order=DEBUG

# Keep third-party frameworks quiet so app logs stay readable.
logging.level.org.springframework=OFF
logging.level.org.hibernate=OFF

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n

journal.enabled=false
spring.application.name=money-maker
server.port=8080
server.shutdown=graceful

# ---------- Run mode ----------
# live     -> LoginScheduler is active (08:00 cron + 1-min heartbeat).
#             Backtest controller is NOT registered (POST /api/backtest/* returns 404).
# backtest -> Scheduler is disabled. Backtest controller is registered and
#             POST /api/backtest/login can drive LoginOrchestrator manually.
app.mode=backtest

# ---------- Database (MySQL, mirrors ui-java tradedb) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/moneymath?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Liquibase ----------
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ---------- Thymeleaf ----------
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.web.resources.static-locations=classpath:/static/

# ---------- Broker login ----------
# Active broker: zerodha | groww | angel-one
broker.active=ZERODHA

# Zerodha (Kite Connect) ? credentials shared with ui-java
broker.zerodha.enabled=true
broker.zerodha.api-key=${KITE_API_KEY:h3h2n4gt1zowxg6o}
broker.zerodha.api-secret=${KITE_API_SECRET:8ouaxdij6x5csagdsnm4z8zxffshje3d}
broker.zerodha.user-id=GP3319
broker.zerodha.redirect-url=http://localhost:8080/login/callback

# Groww (TOTP-based access token)
broker.groww.enabled=false
broker.groww.api-key=
broker.groww.api-secret=
broker.groww.totp-secret=

# Angel One (SmartAPI ? TOTP-based daily login)
broker.angel-one.enabled=false
broker.angel-one.api-key=
broker.angel-one.client-code=
broker.angel-one.password=
broker.angel-one.totp-secret=

# ---------- Telegram alerts ----------
telegram.enabled=true
telegram.bot-token=8674912733:AAG4V3F0Zm4h2UMkZ8K0gIx9OfCKKPS0wUo
telegram.chat-id=856308317
telegram.api-base-url=https://api.telegram.org
# Master gate for backtest mode. When app.mode=backtest AND this is false,
# every telegram.send(...) is a no-op — protects the chat from a multi-day
# replay flooding the channel. Flip to true when you specifically want
# alerts during a backtest run (e.g. validating the bot setup).
telegram.backtest-enabled=true

# ---------- Docs viewer (/docs) ----------
# Root directory scanned for *.md files. Defaults to the working dir, which is
# the project root when running via `mvn spring-boot:run`. Adjust if you start
# the jar from a different CWD.
docs.root=.
docs.max-depth=4

# ---------- Resilience4j: Kite historical-data rate limit + retry ----------
# Throttle: Zerodha allows ~3 historical req/sec. We sit at the documented limit;
# tighten if you see 429s through the limiter. timeout-duration = how long a
# caller will block waiting for a permit before failing fast.
resilience4j.ratelimiter.instances.kiteHistorical.limit-for-period=3
resilience4j.ratelimiter.instances.kiteHistorical.limit-refresh-period=1s
resilience4j.ratelimiter.instances.kiteHistorical.timeout-duration=60s
resilience4j.ratelimiter.instances.kiteHistorical.register-health-indicator=false

# Retry: only KiteRateLimitException triggers backoff. 4 attempts total
# (1 initial + 3 retries) with exponential backoff: 200ms, 400ms, 800ms (cap 5s).
resilience4j.retry.instances.kiteHistorical.max-attempts=4
resilience4j.retry.instances.kiteHistorical.wait-duration=200ms
resilience4j.retry.instances.kiteHistorical.enable-exponential-backoff=true
resilience4j.retry.instances.kiteHistorical.exponential-backoff-multiplier=2
resilience4j.retry.instances.kiteHistorical.exponential-max-wait-duration=5s
resilience4j.retry.instances.kiteHistorical.retry-exceptions=com.moneymaker.market.exception.KiteRateLimitException

# ---------- Logging ----------
logging.level.root=OFF
logging.level.com.moneymaker=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Package-specific levels
logging.level.com.moneymaker.strategyr=DEBUG
logging.level.org.springframework=OFF
logging.level.org.hibernate=OFF


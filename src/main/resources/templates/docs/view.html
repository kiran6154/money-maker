<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${docTitle != null ? 'Money Maker — ' + docTitle : 'Money Maker — Docs'}">Docs</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <style>
        .docs-shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
        .docs-side  { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow:auto; }
        .docs-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
                             color: var(--text-muted); margin: 14px 8px 4px; }
        .docs-link { display: block; padding: 6px 10px; border-radius: 6px; color: var(--text);
                     text-decoration: none; font-size: 14px; }
        .docs-link:hover  { background: rgba(0,0,0,0.04); }
        .docs-link.active { background: rgba(0,122,255,0.18); color: var(--primary-strong); font-weight: 600; }
        .markdown-body { max-width: 980px; line-height: 1.65; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 1.4em; }
        .markdown-body h1 { border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 6px; }
        .markdown-body code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
        .markdown-body pre  { background: rgba(0,0,0,0.06); padding: 14px; border-radius: 8px; overflow:auto; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body table { border-collapse: collapse; margin: 12px 0; width: 100%; }
        .markdown-body th, .markdown-body td { border: 1px solid rgba(0,0,0,0.08); padding: 6px 10px; text-align: left; }
        .markdown-body th { background: rgba(0,0,0,0.04); }
        .markdown-body blockquote { border-left: 3px solid rgba(0,122,255,0.5); margin: 10px 0;
                                    padding: 4px 12px; color: var(--text-muted); }
        .markdown-body a { color: var(--primary-strong); }
        @media (max-width: 900px) {
            .docs-shell { grid-template-columns: 1fr; }
            .docs-side  { position: static; max-height: none; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="page page--full">
    <h1 class="page-title">📚 Documents</h1>
    <p class="page-subtitle">
        Auto-discovered Markdown files under
        <code th:text="${@environment.getProperty('docs.root') ?: '.'}">.</code>.
        Drop a new <code>.md</code> file anywhere under the workspace and it appears here on next refresh.
    </p>

    <div class="docs-shell">
        <aside class="glass-card docs-side">
            <div class="card-header"><h3>Files</h3>
                <span class="badge badge-info" th:text="${#lists.size(docs)}">0</span></div>

            <div th:if="${#lists.isEmpty(docs)}"
                 style="padding:14px; color: var(--text-muted);">
                No <code>.md</code> files found.
            </div>

            <th:block th:each="d,iter : ${docs}">
                <div th:if="${iter.first or d.group != docs[iter.index - 1].group}"
                     class="docs-group-title"
                     th:text="${d.group == 'root'} ? 'Top level' : ${d.group}">root</div>
                <a th:href="@{/docs/view(file=${d.relativePath})}"
                   class="docs-link"
                   th:classappend="${d.relativePath == currentFile} ? ' active'"
                   th:text="${d.name}">file.md</a>
            </th:block>
        </aside>

        <article class="glass-card">
            <div class="card-header">
                <h3 th:text="${docTitle} ?: 'Select a document'">Document</h3>
                <span class="badge badge-info" th:if="${currentFile != null}" th:text="${currentFile}">path</span>
            </div>
            <div class="markdown-body" th:utext="${docHtml}">
                <p>Pick a file from the list on the left.</p>
            </div>
        </article>
    </div>
</main>
</body>
</html>

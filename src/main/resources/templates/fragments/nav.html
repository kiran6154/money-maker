<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" class="glass-nav">
    <a th:href="@{/}" class="nav-brand">💰 Money Maker</a>
    <button type="button"
            class="nav-toggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="primaryNavLinks"
            onclick="(function(b){var n=document.getElementById('primaryNavLinks');var open=n.classList.toggle('open');b.setAttribute('aria-expanded',open);})(this)">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
    </button>
    <div id="primaryNavLinks" class="nav-links">
        <a th:href="@{/}"         class="nav-link" th:classappend="${activePage == 'dashboard'} ? ' active'">Dashboard</a>
        <a th:href="@{/charts/dashboard}" class="nav-link" th:classappend="${activePage == 'charts'} ? ' active'">Charts</a>
        <!-- One canonical login entry: visible only when not logged in. Once authenticated
             the user navigates via the dashboard / logout button below. -->
        <a th:href="@{/login}"    class="nav-link" th:classappend="${activePage == 'login'} ? ' active'"
           th:unless="${loggedIn}">🔑 Broker Login</a>
        <a th:href="@{/backtest}" class="nav-link" th:classappend="${activePage == 'backtest'}  ? ' active'">🧪 Backtest</a>
        <a th:href="@{/trade-configs}" class="nav-link" th:classappend="${activePage == 'trade-configs'} ? ' active'">⚙ Trade Configs</a>
        <a th:href="@{/docs}"     class="nav-link" th:classappend="${activePage == 'docs'}      ? ' active'">📚 Documents</a>
        <span class="nav-separator"></span>
        <span class="nav-link" style="cursor:default;" id="navStatus">
            <span class="status-dot"
                  th:classappend="${lastHeartbeatStatus != null and lastHeartbeatStatus.name() == 'OK'} ? 'online' :
                                  (${lastHeartbeatStatus != null and lastHeartbeatStatus.name() == 'NO_DATA'} ? 'warn' : 'offline')"></span>
            <span th:text="${lastHeartbeatStatus} ?: 'UNKNOWN'">Status</span>
        </span>
        <!-- Logout sits in the nav too, so it's reachable from any page -->
        <form th:if="${loggedIn}" th:action="@{/logout}" method="post" style="display:inline; margin:0;">
            <button type="submit" class="nav-link"
                    style="background:none; border:none; cursor:pointer; color:inherit;">
                ⏻ Logout
            </button>
        </form>
    </div>
</nav>
</body>
</html>

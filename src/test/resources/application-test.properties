# ============================================================
# Test profile — H2 in MySQL compatibility mode.
# ============================================================
# Why H2 not Testcontainers: dev environment has no Docker.
# Why MODE=MySQL: native query in TradeConfigRepository uses
#   DATE(tc.trading_date) — MySQL-specific function call.
# Risk we accept: H2's BETWEEN + index behaviour can differ
#   from real MySQL on edge cases. Mitigated by periodic
#   manual re-verification against the prod DB.
# ============================================================

spring.datasource.url=jdbc:h2:mem:moneymath_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Liquibase: same master changelog as production. Every changeset must
# work on both H2-MySQL and real MySQL or the parity test is meaningless.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ---------- Backtest ----------
# Tests need a clean slate before each run. Production default is false.
backtest.auto-reset=true

# ---------- App mode ----------
# Tests run the backtest pipeline; live cron must not fire in parallel.
app.mode=backtest

# ---------- Telegram ----------
# Hard off — tests must never page the chat.
telegram.enabled=false
telegram.backtest-enabled=false

# ---------- Logging ----------
logging.level.root=WARN
logging.level.com.moneymaker=INFO
logging.level.org.springframework=OFF
logging.level.org.hibernate=OFF
